name: Audit SEC issuer fact tags
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Supported issuer(s), comma-separated, or ALL
        required: true
        default: VNET
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Inspect primary-source tag dates and reporting units
        run: node scripts/audit-sec-facts.js "$AUDIT_TICKER"
        env:
          AUDIT_TICKER: ${{ inputs.ticker }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
