name: Audit SEC issuer fact tags
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Supported issuer(s), comma-separated, or ALL
        required: true
        default: VNET
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Inspect primary-source tag dates and reporting units
        run: node scripts/audit-sec-facts.js "$AUDIT_TICKER"
        env:
          AUDIT_TICKER: ${{ inputs.ticker }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
