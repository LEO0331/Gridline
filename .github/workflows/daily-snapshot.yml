name: Refresh daily dashboard snapshot

on:
  schedule:
    # 22:17 UTC is after 4 PM ET in both EST and EDT. Non-price sources
    # refresh daily; price ingestion checks the NYSE trading calendar.
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        type: choice
        options: [all, company-coverage]
        default: all

permissions:
  contents: write
  # Snapshot commits are created with GITHUB_TOKEN. Those pushes intentionally do
  # not trigger other workflows, so this workflow explicitly dispatches Pages.
  actions: write

concurrency:
  group: daily-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh providers with retained last-known-good data
        run: npm run snapshot
        env:
          SCHEDULE_SOURCES: ${{ inputs.scope == 'company-coverage' && 'sec,company-research' || 'sec,prices,eia,events,company-research' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
          FERC_API_KEY: ${{ secrets.FERC_API_KEY }}
          COMPANY_IR_FEEDS: ${{ secrets.COMPANY_IR_FEEDS }}
      - name: Validate public-demo snapshot invariants
        run: npm run demo:check
      - name: Commit refreshed static snapshot when changed
        id: publish-snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard-snapshot.json public/data/dashboard-overview.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot is unchanged; no Pages deployment is required."
          else
            git commit -m "Refresh post-close dashboard snapshot"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch Pages deployment for refreshed snapshot
        if: steps.publish-snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Dispatched Deploy to GitHub Pages for the refreshed snapshot commit."
