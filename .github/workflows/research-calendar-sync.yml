name: Sync Research Calendar

on:
  schedule:
    - cron: '17 3 * * 2' # Tuesday 11:17 Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, review, verified]
        default: dry-run
        description: Discovery and publication mode
      past_days:
        type: number
        default: 30
        description: Days to check for corrections
      future_days:
        type: number
        default: 90
        description: Days to check for upcoming events

permissions:
  contents: read

concurrency:
  group: research-calendar-sync
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.scan.outputs.base }}
      changed: ${{ steps.scan.outputs.changed }}
      review: ${{ steps.scan.outputs.review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check official calendar evidence
        id: scan
        env:
          MODE: ${{ inputs.mode || 'verified' }}
          PAST_DAYS: ${{ inputs.past_days }}
          FUTURE_DAYS: ${{ inputs.future_days }}
        run: |
          printf 'base=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/sync-research-calendar.js --mode "$MODE" --past-days "${PAST_DAYS:-30}" --future-days "${FUTURE_DAYS:-90}" --output "$RUNNER_TEMP/calendar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-calendar-scan
          path: ${{ runner.temp }}/calendar/
          retention-days: 30
          if-no-files-found: error

  review:
    needs: discover
    if: needs.discover.outputs.review == 'true' && inputs.mode != 'dry-run' && vars.ENABLE_CALENDAR_REVIEW_PRS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-calendar-scan
          path: ${{ runner.temp }}/calendar/
      - name: Open or reuse candidate review
        env:
          ENABLE_CALENDAR_REVIEW_PRS: 'true'
          GH_TOKEN: ${{ github.token }}
          CALENDAR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! node scripts/publish-research-calendar.js review "$RUNNER_TEMP/calendar"; then
            echo 'Review PR unavailable. Use the research-calendar-scan artifact for human review.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: discover
    if: needs.discover.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.mode == 'verified') && vars.ENABLE_CALENDAR_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-calendar-scan
          path: ${{ runner.temp }}/calendar/
      - run: npm ci
      - name: Validate and publish the calendar registry
        id: publish-calendar
        env:
          ENABLE_CALENDAR_AUTO_PUBLISH: 'true'
          BASE: ${{ needs.discover.outputs.base }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-research-calendar.js verified "$RUNNER_TEMP/calendar" "$BASE"
      - name: Request Pages application deployment
        if: steps.publish-calendar.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish-calendar.outputs.published_sha }}
        run: |
          echo "Calendar registry published at $PUBLISHED_SHA." >> "$GITHUB_STEP_SUMMARY"
          if ! gh workflow run deploy-pages.yml --ref main -f reason=application; then
            echo 'Pages dispatch failed. Retry Deploy to GitHub Pages on main with reason application.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Pages deployment requested. Check the separate Pages run for its result.' >> "$GITHUB_STEP_SUMMARY"
