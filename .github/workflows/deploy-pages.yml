name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'build/**'
  workflow_dispatch:
    inputs:
      reason:
        description: Deployment reason (all deployments run the verification gate)
        type: choice
        options: [application, snapshot]
        default: application
  schedule:
    # Monday 10:37 Asia/Taipei: audit the deployed site without redeploying it.
    - cron: '37 2 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lighthouse: ${{ steps.changes.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select full site audit for application changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          audit=true
          if [ "$EVENT" = workflow_dispatch ] && [ "$REASON" = snapshot ]; then
            audit=false
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^public/data/dashboard-(snapshot|overview)\.json$'; then
              audit=false
            fi
          fi
          echo "lighthouse=$audit" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production revision
        uses: ./.github/actions/verify

      - name: Public snapshot acceptance
        run: npm run demo:check

      - name: Build site
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  lighthouse:
    name: Lighthouse CI (deployed site)
    runs-on: ubuntu-latest
    needs: [plan, deploy]
    timeout-minutes: 10
    if: >-
      always() && !cancelled() && !failure() &&
      (github.event_name == 'schedule' ||
      (needs.deploy.result == 'success' && needs.plan.outputs.lighthouse == 'true'))
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          urls: |
            ${{ needs.deploy.outputs.page_url || 'https://leo0331.github.io/Gridline/' }}
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
