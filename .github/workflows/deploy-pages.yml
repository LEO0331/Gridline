name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'build/**'
  workflow_dispatch:
    inputs:
      reason:
        description: Deployment reason (all deployments run the verification gate)
        type: choice
        options: [application, snapshot]
        default: application
  schedule:
    # Monday 10:37 Asia/Taipei: audit the deployed site without redeploying it.
    - cron: '37 2 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lighthouse: ${{ steps.changes.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select full site audit for application changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          audit=true
          if [ "$EVENT" = workflow_dispatch ] && [ "$REASON" = snapshot ]; then
            audit=false
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^public/data/dashboard-(snapshot|overview)\.json$'; then
              audit=false
            fi
          fi
          echo "lighthouse=$audit" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production revision
        uses: ./.github/actions/verify

      - name: Public snapshot acceptance
        run: npm run demo:check

      - name: Build site
        run: npm run build
        env:
          GENERATE_SOURCEMAP: 'true'
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify production exposure and dependency security policy
        run: |
          node scripts/dependency-exposure.js > dependency-exposure.json
          npm run security:audit -- dependency-exposure.json

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  lighthouse:
    name: Lighthouse CI (deployed site)
    runs-on: ubuntu-latest
    needs: [plan, deploy]
    timeout-minutes: 10
    if: >-
      always() && !cancelled() && !failure() &&
      (github.event_name == 'schedule' ||
      (needs.deploy.result == 'success' && needs.plan.outputs.lighthouse == 'true'))
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            ${{ needs.deploy.outputs.page_url || 'https://leo0331.github.io/Gridline/' }}
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
