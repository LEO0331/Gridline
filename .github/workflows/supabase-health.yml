name: Check Supabase database health

on:
  schedule:
    # Daily at 14:43 Asia/Taipei; independent of market-data refreshes.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check database through the public health RPC
        id: database-health
        run: npm run health:supabase
        env:
          SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
      - name: Summarize database heartbeat
        if: always()
        run: node scripts/workflow-summary.js supabase
        env:
          HEALTH_OUTCOME: ${{ steps.database-health.outcome }}
