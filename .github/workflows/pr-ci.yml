name: Pull request quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 11:11 Asia/Taipei: fresh build/exposure proof and dependency review.
    - cron: '11 3 * * 1'

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Keep this Node major aligned with package-lock.json regeneration.
jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/verify
        if: github.event_name != 'schedule'
      - name: Public snapshot acceptance
        if: github.event_name != 'schedule'
        run: npm run demo:check
      - name: Production build
        run: npm run build
        env:
          GENERATE_SOURCEMAP: 'true'
      - name: Verify production and runtime exposure
        run: node scripts/dependency-exposure.js > dependency-exposure.json
      - name: Retain current-revision exposure proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-exposure
          path: dependency-exposure.json
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency security gate
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Reject absent or failed exposure verification
        if: needs.verify.result != 'success'
        run: |
          echo "### Dependency security gate: blocked because fresh build/exposure verification failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Download proof from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-exposure
      - name: Enforce advisory policy and expiry
        run: npm run security:audit -- dependency-exposure.json
