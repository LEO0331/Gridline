name: Pull request quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 11:11 Asia/Taipei: detect newly disclosed dependency findings.
    - cron: '11 3 * * 1'

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Keep this Node major aligned with package-lock.json regeneration.
jobs:
  verify:
    name: Tests and production build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/verify
      - name: Public snapshot acceptance
        run: npm run demo:check
      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency security gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Block high and critical dependency findings
        run: npm audit --package-lock-only --audit-level=high
      - name: Report dependency gate outcome
        if: always()
        env:
          AUDIT_STATUS: ${{ job.status }}
        run: |
          echo "### Dependency security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $AUDIT_STATUS. High and critical findings block this job; inspect the audit step for package paths and advisories." >> "$GITHUB_STEP_SUMMARY"
