name: Passive probe sensor CI
on:
  pull_request:
    paths:
      - 'security-probe-sensor/**'
      - '.github/workflows/passive-probe-sensor-ci.yml'
  push:
    branches: [feat/passive-security-probe-sensor]
    paths:
      - 'security-probe-sensor/**'
      - '.github/workflows/passive-probe-sensor-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: security-probe-sensor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: security-probe-sensor/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --check sensor.js && node --check server.js && node --check csv.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=low
