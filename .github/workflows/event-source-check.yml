name: Check official event source access

on:
  workflow_dispatch:
    inputs:
      alternatives:
        description: Include inactive alternatives and representative article probes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Probe official discovery listings and candidate articles
        run: node scripts/check-event-sources.js event-source-report.json
        env:
          PROBE_EVENT_ALTERNATIVES: ${{ inputs.alternatives && 'true' || 'false' }}
      - name: Retain provider access evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-source-report
          path: event-source-report.json
